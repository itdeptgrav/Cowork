<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984.894 1000">
  <!-- A notification BADGE is drawn as a mask: the platform keeps the alpha
       channel and paints it one flat colour, so any colour in the source is
       discarded. This is therefore a silhouette — the folder, with the check
       punched out as real transparency so it survives that treatment. The
       full-colour logo used here before arrived as a solid blob. -->
